<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#536179"/>
    </marker>
  </defs>
  <rect width="780" height="220" fill="#ffffff"/>
  <line x1="40" y1="110" x2="740" y2="110" stroke="#536179" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#536179">increasing isolation, increasing overhead →</text>

  <rect x="40" y="50" width="200" height="60" rx="8" fill="#eef3ff" stroke="#2446a8"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#172d70">Skills</text>
  <text x="140" y="93" text-anchor="middle" font-size="11" fill="#536179">in-context, same session</text>

  <rect x="290" y="50" width="200" height="60" rx="8" fill="#eef3ff" stroke="#2446a8"/>
  <text x="390" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#172d70">Subagents</text>
  <text x="390" y="93" text-anchor="middle" font-size="11" fill="#536179">isolated context, one-way handoff</text>

  <rect x="540" y="50" width="200" height="60" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="640" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Agent teams</text>
  <text x="640" y="93" text-anchor="middle" font-size="11" fill="#7c2d12">separate processes (experimental)</text>
</svg>
