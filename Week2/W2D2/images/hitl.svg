<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="arrow8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#536179"/>
    </marker>
  </defs>
  <rect width="760" height="220" fill="#ffffff"/>
  <rect x="20" y="70" width="150" height="60" rx="8" fill="#eef3ff" stroke="#2446a8"/>
  <text x="95" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#172d70">Agent proposes</text>
  <text x="95" y="112" text-anchor="middle" font-size="11" fill="#536179">e.g. approve payment</text>
  <path d="M170,100 L230,100" stroke="#536179" marker-end="url(#arrow8)"/>

  <rect x="230" y="70" width="150" height="60" rx="8" fill="#fef3c7" stroke="#92400e"/>
  <text x="305" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Checkpoint / pause</text>
  <text x="305" y="112" text-anchor="middle" font-size="11" fill="#92400e">durable, resumable</text>
  <path d="M380,100 L440,100" stroke="#536179" marker-end="url(#arrow8)"/>

  <rect x="440" y="70" width="150" height="60" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="515" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Human decides</text>
  <text x="515" y="112" text-anchor="middle" font-size="11" fill="#7c2d12">approve / reject / edit</text>
  <path d="M590,100 L650,100" stroke="#536179" marker-end="url(#arrow8)"/>

  <rect x="650" y="70" width="100" height="60" rx="8" fill="#e7f7ee" stroke="#278653"/>
  <text x="700" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Resume &amp;</text>
  <text x="700" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">execute once</text>

  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#536179">the checkpoint must survive a process restart — that's what makes it durable, not just a confirm dialog</text>
</svg>
