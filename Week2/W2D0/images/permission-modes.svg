<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="780" height="220" fill="#ffffff"/>
  <g font-size="11" font-weight="700">
    <rect x="10" y="20" width="140" height="70" rx="6" fill="#f0fdf4" stroke="#278653"/>
    <text x="80" y="45" text-anchor="middle" fill="#166534">plan</text>
    <text x="80" y="63" text-anchor="middle" font-size="9" font-weight="400" fill="#166534">reads/analyzes,</text>
    <text x="80" y="77" text-anchor="middle" font-size="9" font-weight="400" fill="#166534">proposes, no edits</text>

    <rect x="160" y="20" width="140" height="70" rx="6" fill="#fef3c7" stroke="#92400e"/>
    <text x="230" y="45" text-anchor="middle" fill="#92400e">manual</text>
    <text x="230" y="63" text-anchor="middle" font-size="9" font-weight="400" fill="#92400e">asks before every</text>
    <text x="230" y="77" text-anchor="middle" font-size="9" font-weight="400" fill="#92400e">sensitive action</text>

    <rect x="310" y="20" width="140" height="70" rx="6" fill="#eef3ff" stroke="#2446a8"/>
    <text x="380" y="45" text-anchor="middle" fill="#172d70">acceptEdits</text>
    <text x="380" y="63" text-anchor="middle" font-size="9" font-weight="400" fill="#172d70">file edits auto-ok,</text>
    <text x="380" y="77" text-anchor="middle" font-size="9" font-weight="400" fill="#172d70">still asks for Bash etc.</text>

    <rect x="460" y="20" width="140" height="70" rx="6" fill="#eef3ff" stroke="#2446a8"/>
    <text x="530" y="45" text-anchor="middle" fill="#172d70">auto / dontAsk</text>
    <text x="530" y="63" text-anchor="middle" font-size="9" font-weight="400" fill="#172d70">fewer prompts,</text>
    <text x="530" y="77" text-anchor="middle" font-size="9" font-weight="400" fill="#172d70">policy still applies</text>

    <rect x="610" y="20" width="150" height="70" rx="6" fill="#fff0f0" stroke="#bb2d3b"/>
    <text x="685" y="45" text-anchor="middle" fill="#7f1d1d">bypassPermissions</text>
    <text x="685" y="63" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">no prompts at all —</text>
    <text x="685" y="77" text-anchor="middle" font-size="9" font-weight="400" fill="#7f1d1d">sandboxes only</text>
  </g>
  <text x="390" y="140" text-anchor="middle" font-size="12" fill="#536179">the real modes, from `claude --help`: plan, manual, acceptEdits, auto, dontAsk, bypassPermissions</text>
  <text x="390" y="165" text-anchor="middle" font-size="12" fill="#7c2d12" font-weight="700">less friction on the right, less safety net — choose deliberately, per task</text>
</svg>
