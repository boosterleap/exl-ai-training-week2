<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="780" height="220" fill="#ffffff"/>
  <rect x="30" y="30" width="330" height="160" rx="10" fill="#f0fdf4" stroke="#278653" stroke-dasharray="6 4"/>
  <text x="195" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Trusted (your code)</text>
  <rect x="55" y="75" width="120" height="45" rx="6" fill="#eef3ff" stroke="#2446a8"/>
  <text x="115" y="102" text-anchor="middle" font-size="11">Claude Code</text>
  <rect x="200" y="75" width="130" height="45" rx="6" fill="#eef3ff" stroke="#2446a8"/>
  <text x="265" y="97" text-anchor="middle" font-size="10">MCP tool code</text>
  <text x="265" y="112" text-anchor="middle" font-size="9">(real auth check here)</text>
  <text x="195" y="160" text-anchor="middle" font-size="10" fill="#166534">the model's opinion is never</text>
