<svg viewBox="0 0 740 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="arrowgs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#536179"/>
    </marker>
  </defs>
  <rect width="740" height="200" fill="#ffffff"/>
  <rect x="20" y="70" width="150" height="55" rx="8" fill="#eef3ff" stroke="#2446a8"/>
  <text x="95" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#172d70">Task completes</text>
  <path d="M170,97 L220,97" stroke="#536179" marker-end="url(#arrowgs)"/>
  <rect x="220" y="70" width="150" height="55" rx="8" fill="#fef3c7" stroke="#92400e"/>
  <text x="295" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Stop hook fires</text>
  <text x="295" y="110" text-anchor="middle" font-size="9" fill="#92400e">checks git status</text>
  <path d="M370,97 L420,97" stroke="#536179" marker-end="url(#arrowgs)"/>
  <rect x="420" y="70" width="150" height="55" rx="8" fill="#f0fdf4" stroke="#278653"/>
  <text x="495" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Auto-commit</text>
  <text x="495" y="110" text-anchor="middle" font-size="9" fill="#166534">clear, scoped message</text>
  <path d="M570,97 L620,97" stroke="#536179" marker-end="url(#arrowgs)"/>
  <rect x="620" y="70" width="100" height="55" rx="8" fill="#eef3ff" stroke="#2446a8"/>
  <text x="670" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#172d70">Push (optional)</text>

  <text x="370" y="165" text-anchor="middle" font-size="12" fill="#7c2d12" font-weight="700">never auto-push to a shared branch without explicit opt-in — commit is safe, push is a team-visible action</text>
</svg>
