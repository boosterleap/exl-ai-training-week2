      <path d="M0,0 L10,5 L0,10 z" fill="#536179"/>
    </marker>
  </defs>
  <rect width="820" height="200" fill="#ffffff"/>
  <line x1="30" y1="100" x2="790" y2="100" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="11">
    <circle cx="60" cy="100" r="6" fill="#2446a8"/>
    <text x="60" y="70" text-anchor="middle" font-weight="700" fill="#172d70">SessionStart</text>

    <circle cx="220" cy="100" r="6" fill="#2446a8"/>
