  <text x="510" y="97" text-anchor="middle" font-size="10">Bedrock / gateway</text>
  <text x="510" y="112" text-anchor="middle" font-size="9">provider boundary</text>
  <rect x="590" y="75" width="130" height="45" rx="6" fill="#fff7ed" stroke="#c2410c"/>
